<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-version" content="v2.0525.1754">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1f4e">
<title>ENTRIX – Quotation App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#0a1f4e;--blue:#1a3a7c;--gold:#e8a020;--gold2:#f5c518;--green:#1a6b3a;--wa:#25d366;--red:#c04040;--purple:#6a0dad;--bg:#f0f4fa;--bd:#dce5f5}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1a2540;font-size:15px;min-height:100vh}

/* ── LOGIN ── */
#loginScreen{position:fixed;inset:0;background:linear-gradient(150deg,#061228 0%,#0d2550 50%,#1a3a7c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px}
.login-logo{width:72px;height:72px;background:var(--gold);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--navy);margin-bottom:10px;box-shadow:0 8px 32px rgba(232,160,32,.4)}
.login-title{color:#fff;font-size:24px;font-weight:800;letter-spacing:1.5px}
.login-sub{color:#7aa4e8;font-size:11px;letter-spacing:2px;margin-bottom:30px;text-transform:uppercase}
.role-cards{display:flex;gap:14px;margin-bottom:22px;width:100%;max-width:360px}
.role-card{flex:1;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:all .2s}
.role-card.selected{background:rgba(232,160,32,.18);border-color:var(--gold)}
.role-icon{font-size:30px;margin-bottom:7px}
.role-name{color:#fff;font-weight:700;font-size:15px}
.role-desc{color:#7aa4e8;font-size:11px;margin-top:3px}
.login-box{width:100%;max-width:360px}
.login-box input{width:100%;padding:13px 16px;border:2px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit}
.login-box input:focus{border-color:var(--gold)}
.login-box input::placeholder{color:rgba(255,255,255,.4)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#e8a020,#c47a10);color:var(--navy);border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.login-err{color:#ff8080;font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#0a1f4e,#1a3a7c);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:100}
.hdr-logo{width:38px;height:38px;min-width:38px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--navy)}
.hdr-name{color:#fff;font-weight:800;font-size:15px;line-height:1.2}
.hdr-sub{color:#8eb4ff;font-size:10px;letter-spacing:1px}
.role-pill{margin-left:auto;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-admin{background:rgba(232,160,32,.2);border:1px solid var(--gold);color:var(--gold)}
.pill-user{background:rgba(29,184,122,.2);border:1px solid #1db87a;color:#1db87a}
.exit-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;margin-left:6px}

/* ── TABS ── */
.tabs{background:#fff;border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;border-bottom:3px solid transparent;padding:11px 13px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:#7a8fb0;white-space:nowrap;transition:all .15s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ── LAYOUT ── */
.wrap{max-width:700px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.ct{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;padding-bottom:7px;border-bottom:2px solid var(--gold)}
label{display:block;font-size:11px;font-weight:700;color:#5a6a8a;letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px;margin-top:10px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d0d9ee;border-radius:7px;font-size:14px;color:#1a2540;background:#fff;outline:none;-webkit-appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ifl{display:flex;gap:6px;align-items:center}

/* ── MARGIN BANNER ── */
.mb{background:linear-gradient(135deg,#fff8e0,#fff3c0);border:2px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.mb-title{font-weight:800;color:#8a5a00;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.mb-row{display:flex;align-items:center;gap:10px}
.mb-row input[type=range]{flex:1;accent-color:var(--gold)}
.mb-num{width:58px;padding:6px 8px;border:2px solid var(--gold);border-radius:6px;font-weight:800;font-size:14px;text-align:center;color:#8a5a00}

/* ── ITEM CARD ── */
.item-card{background:#f7f9ff;border:1.5px solid var(--bd);border-radius:10px;padding:13px;margin-bottom:10px;position:relative}
.item-badge{position:absolute;top:11px;right:11px;background:var(--blue);color:#fff;border-radius:5px;padding:2px 9px;font-size:11px;font-weight:700}
.custom-card{background:#faf5ff;border:1.5px solid #c084fc}
/* price master picker */
.pm-picker{background:#1a3a7c;border-radius:9px;padding:12px 13px;margin-bottom:10px}
.pm-picker-title{color:#e8a020;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:5px}
/* searchable dropdown */
.pm-search-wrap{position:relative}
.pm-search-input{width:100%;padding:10px 36px 10px 12px;border:2px solid #e8a020;border-radius:7px;background:#0a1f4e;color:#fff;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
.pm-search-input::placeholder{color:rgba(255,255,255,.45)}
.pm-search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#e8a020;font-size:18px;cursor:pointer;padding:0;line-height:1}
.pm-dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#0d2550;border:2px solid #e8a020;border-radius:8px;max-height:260px;overflow-y:auto;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.pm-dropdown::-webkit-scrollbar{width:5px}
.pm-dropdown::-webkit-scrollbar-thumb{background:#e8a020;border-radius:3px}
.pm-cat-header{padding:5px 12px;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#e8a020;background:#061228;position:sticky;top:0}
.pm-option{padding:10px 14px;font-size:13px;color:#fff;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);transition:background .1s}
.pm-option:hover,.pm-option.active{background:rgba(232,160,32,.2)}
.pm-option-name{font-weight:600;line-height:1.3}
.pm-no-result{padding:16px;text-align:center;color:rgba(255,255,255,.4);font-size:13px}
.pm-optgroup-hdr{background:#0a1f4e;color:#e8a020;font-weight:700}
/* discount box */
.disc-box{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #34d399;border-radius:9px;padding:10px 12px;margin:8px 0}
.disc-title{font-size:11px;font-weight:800;color:#065f46;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.disc-row{display:flex;align-items:center;gap:10px}
.disc-row input[type=range]{flex:1;accent-color:#34d399}
.disc-input{width:58px;padding:6px 8px;border:2px solid #34d399;border-radius:6px;font-weight:800;font-size:14px;text-align:center;color:#065f46}
.price-breakdown{background:#fff;border:1px solid #d1fae5;border-radius:8px;padding:9px 12px;font-size:12px;margin-top:6px}
.pb-row{display:flex;justify-content:space-between;padding:2px 0;color:#4b5563}
.pb-row.strike{color:#9ca3af;text-decoration:line-through}
.pb-row.final{font-weight:800;font-size:14px;color:#065f46;border-top:1.5px solid #34d399;margin-top:5px;padding-top:5px}

/* ── QTY BANNER ── */
.qty-box{background:linear-gradient(135deg,#0d2550,#1a3a7c);border-radius:9px;padding:11px 14px;margin:10px 0;display:flex;align-items:center;gap:12px}
.qty-label{color:#8eb4ff;font-size:11px;font-weight:700;letter-spacing:1px;margin:0}
.qty-input{background:rgba(255,255,255,.15);border:2px solid var(--gold);border-radius:8px;color:#fff;font-size:22px;font-weight:900;text-align:center;width:76px;padding:7px 4px}
.qty-hint{color:#8eb4ff;font-size:11px;flex:1;line-height:1.4}

/* ── SOLAR FIELDS ── */
.solar-box{background:#ecfdf5;border:1.5px solid #34d399;border-radius:9px;padding:11px 12px;margin:8px 0}
.solar-box-title{font-size:11px;font-weight:800;color:#065f46;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.solar-box label{color:#065f46}
.solar-box select{border-color:#34d399}

/* ── NA BOX ── */
.na-box{background:#f5f5f5;border:1.5px dashed #ccc;border-radius:9px;padding:10px 14px;margin:8px 0;font-size:12px;color:#aaa;text-align:center}

/* ── COMPONENT TOGGLES ── */
.comp-section{margin:8px 0}
.comp-section-title{font-size:11px;font-weight:700;color:#1a3a7c;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.ctog{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none;transition:all .15s;font-size:13px;font-weight:600;border:1.5px solid}
.ctog.on{background:#ecfdf5;border-color:#34d399;color:#065f46}
.ctog.off{background:#fff5f5;border-color:#fca5a5;color:#991b1b;opacity:.75}
.ctog .ck{font-size:17px;line-height:1}

/* ── COMP DETAIL ── */
.comp-detail{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.comp-detail label{margin-top:0;color:#1a3a7c}

/* ── SPEC BOX ── */
.spec-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #93c5fd;border-radius:8px;padding:9px 12px;margin-top:5px;font-size:11px;color:#1e40af;line-height:1.7}
.spec-title{font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#1e3a8a;margin-bottom:4px;display:flex;align-items:center;gap:4px}

/* ── PRICE TAGS ── */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700}
.tag-cost{background:#dbeafe;color:#1e40af}
.tag-unit{background:#fef3c7;color:#92400e}
.tag-gst{background:#d1fae5;color:#065f46}
.tag-total{background:#dcfce7;color:#14532d}

/* ── TOTALS ── */
.totals-box{background:linear-gradient(135deg,#f0f7ff,#e8f0ff);border:1px solid #93c5fd;border-radius:9px;padding:14px;margin-top:10px}
.tot-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:#4b5563}
.tot-grand{display:flex;justify-content:space-between;border-top:2px solid var(--gold);margin-top:8px;padding-top:8px;font-weight:900;font-size:20px;color:var(--blue)}
.tot-words{font-size:11px;color:#6b7280;font-style:italic;margin-top:4px}

/* ── BUTTONS ── */
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-navy{background:var(--blue);color:#fff}
.btn-gold{background:linear-gradient(135deg,#e8a020,#c47a10);color:var(--navy)}
.btn-green{background:linear-gradient(135deg,#15803d,#166534);color:#fff}
.btn-wa{background:linear-gradient(135deg,#25d366,#16a34a);color:#fff}
.btn-pdf{background:linear-gradient(135deg,#1e40af,#1e3a8a);color:#fff}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff}
.btn-danger{background:rgba(220,38,38,.1);color:#dc2626;border:1px solid #fca5a5}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-full{width:100%}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* ── PRICE TABLE ── */
.price-section{margin-bottom:16px;border-radius:10px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.cat-hdr{padding:9px 14px;color:#fff;font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.ptbl{width:100%;border-collapse:collapse;font-size:13px}
.ptbl th{background:var(--blue);color:#fff;padding:7px 9px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.ptbl td{padding:8px 9px;border-bottom:1px solid #eef0f8;vertical-align:middle}
.ptbl tr:nth-child(even) td{background:#f7f9ff}
.add-form{background:#fffce8;padding:10px 12px;display:flex;flex-direction:column;gap:7px;border-bottom:2px dashed var(--gold)}

/* ── ADMIN PRODUCT CARDS ── */
.prod-cards{display:grid;grid-template-columns:1fr;gap:10px;padding:12px}
.prod-card{background:#fff;border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);transition:box-shadow .15s}
.prod-card:hover{box-shadow:0 3px 14px rgba(0,0,0,.1)}
.prod-card-header{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 13px 8px;border-bottom:1px solid var(--bd);gap:8px}
.prod-card-name{font-weight:700;font-size:14px;color:#1a2540;flex:1;line-height:1.3}
.prod-card-price{font-weight:800;font-size:15px;white-space:nowrap;padding:3px 10px;border-radius:7px;background:#fef3c7;color:#92400e}
.prod-card-desc{padding:8px 13px;font-size:12px;color:#4b5563;line-height:1.65;background:#fafbff}
.prod-card-footer{padding:8px 13px;display:flex;gap:7px;border-top:1px solid var(--bd);background:#f8faff}
.prod-card-num{position:absolute;top:11px;left:-1px;background:var(--blue);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:0 5px 5px 0}
/* Add form card */
.add-card{background:linear-gradient(135deg,#fffce8,#fff8d0);border:2px dashed var(--gold);border-radius:10px;padding:14px;margin:0 12px 12px}
.add-card-title{font-weight:800;color:#8a5a00;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.field-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.field-row .f{display:flex;flex-direction:column;gap:4px}
.field-row .f label{margin:0;font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.8px}
.field-row .f-name{flex:3;min-width:160px}
.field-row .f-rate{flex:1;min-width:90px}
.field-row .f-unit{flex:1;min-width:80px}
.field-row .f-maxw{flex:1;min-width:70px}
.prod-view-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}

/* ── HISTORY ── */
.hist-item{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px}

/* ── PREVIEW / PRINT ── */
#quote-doc{padding:14px;font-family:Arial,sans-serif;font-size:12px;color:#000}
.doc-hdr{border-bottom:3px solid #0a1f4e;padding-bottom:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.doc-co{font-size:19px;font-weight:900;color:#0a1f4e;letter-spacing:.5px}
.doc-addr{font-size:10px;color:#555;line-height:1.55;margin-top:3px}
.doc-badge{background:#e8a020;color:#0a1f4e;font-weight:900;font-size:13px;padding:3px 12px;border-radius:4px;display:inline-block;margin-bottom:3px}
.client-box{background:#f7f9ff;border:1px solid #dce5f5;padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:12px}
.itbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.itbl th{background:#0a1f4e;color:#fff;padding:5px 6px;text-align:left;white-space:nowrap}
.itbl td{padding:5px 6px;border-bottom:1px solid #e0e8f5;vertical-align:top}
.itbl tr:nth-child(even) td{background:#f9fbff}
.totdoc{float:right;width:265px;font-size:12px}
.totdoc-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #ddd}
.totdoc-grand{display:flex;justify-content:space-between;padding:5px 0;font-weight:900;font-size:14px;color:#0a1f4e;border-top:2px solid #e8a020;margin-top:3px}
.clearfix{clear:both}
.terms-box{background:#f7f9ff;border:1px solid #dce5f5;padding:8px 10px;border-radius:5px;font-size:10px;margin-bottom:8px;line-height:1.7}
.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:10px;margin-bottom:8px}
.footer-bar{background:#0a1f4e;color:#e8a020;font-size:10px;font-weight:700;text-align:center;padding:7px;border-radius:5px}

/* ── SETTINGS ── */
.set-section{background:#fffce8;border:2px solid var(--gold);border-radius:10px;padding:14px;margin-bottom:12px}
/* Export section */
.export-section{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #34d399;border-radius:12px;padding:16px;margin-bottom:14px}
.import-section{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #3b82f6;border-radius:12px;padding:16px;margin-bottom:14px}
.import-title{font-weight:800;color:#1e3a8a;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.data-code-box{background:#0a1f4e;color:#34d399;font-family:monospace;font-size:11px;padding:10px 12px;border-radius:8px;word-break:break-all;line-height:1.6;margin:10px 0;max-height:100px;overflow-y:auto;user-select:all;-webkit-user-select:all}
.wa-share-btn{background:linear-gradient(135deg,#25d366,#16a34a);color:#fff;border:none;border-radius:9px;padding:13px;font-weight:800;font-size:15px;width:100%;cursor:pointer;font-family:inherit;margin-top:8px}
.import-textarea{width:100%;padding:10px 12px;border:2px solid #3b82f6;border-radius:8px;font-family:monospace;font-size:12px;min-height:80px;resize:vertical;background:#f0f7ff;color:#1e3a8a;box-sizing:border-box}
.export-title{font-weight:800;color:#065f46;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.export-desc{font-size:12px;color:#047857;line-height:1.7;margin-bottom:12px}
.export-step{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:13px;color:#064e3b}
.export-step-num{background:#34d399;color:#065f46;font-weight:900;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
.set-title{font-weight:800;color:#8a5a00;font-size:14px;margin-bottom:10px}

/* ── MISC ── */
.msg{font-size:12px;font-weight:700;padding:7px 12px;border-radius:7px;text-align:center;margin-top:6px}
.msg-ok{background:#dcfce7;color:#14532d}
.msg-err{background:#fee2e2;color:#991b1b}
.msg-info{background:#dbeafe;color:#1e40af}
.empty{text-align:center;color:#9ca3af;padding:30px;font-size:13px}
.empty i{font-size:36px;display:block;margin-bottom:8px}
.srchbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.srchbar input,.srchbar select{flex:1;min-width:140px}
.custom-badge{position:absolute;top:11px;right:11px;background:var(--purple);color:#fff;border-radius:5px;padding:2px 9px;font-size:11px;font-weight:700}

/* Custom confirm modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99990;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:14px;padding:24px;max-width:340px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.modal-title{font-size:17px;font-weight:800;color:#1a2540;margin-bottom:8px}
.modal-msg{font-size:14px;color:#4b5563;margin-bottom:20px;line-height:1.5}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.modal-cancel{background:#f3f4f6;color:#374151}
.modal-confirm{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff}
/* Add Category */
.add-cat-form{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:2px dashed #4ade80;border-radius:10px;padding:14px;margin:0 0 14px}
.add-cat-title{font-weight:800;color:#15803d;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* Update notice */
.update-notice{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#e8a020,#c47a10);color:#0a1f4e;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9998;font-weight:700;font-size:13px;box-shadow:0 -3px 12px rgba(0,0,0,.2)}
.update-notice button{background:#0a1f4e;color:#e8a020;border:none;border-radius:6px;padding:6px 14px;font-weight:800;cursor:pointer;font-size:12px}

/* WA PDF status overlay */
.wa-overlay{position:fixed;inset:0;background:rgba(10,31,78,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;padding:24px}
.wa-spinner{width:56px;height:56px;border:5px solid rgba(255,255,255,.2);border-top-color:#25d366;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
.wa-status-title{color:#fff;font-size:18px;font-weight:800;margin-bottom:8px;text-align:center}
.wa-status-sub{color:#8eb4ff;font-size:13px;text-align:center;line-height:1.6}
.wa-progress{width:220px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:14px;overflow:hidden}
.wa-progress-bar{height:100%;background:linear-gradient(90deg,#25d366,#16a34a);border-radius:3px;width:0%;transition:width .3s}

// ═══ CALC ═══
function calcItem(it){
  const qty=parseInt(it.qty)||1;
  if(it.custom){
    const baseRate=parseFloat(it.customRate)||0;
    const disc=(parseFloat(it.discount)||0)/100;
    const u=Math.round(baseRate*(1-disc)*100)/100;
    const discAmt=Math.round(baseRate*disc*qty*100)/100;
    const s=u*qty;const g=s*(it.gstPct||0)/100;
    return{unit:u,qty,sub:s,gst:g,trans:0,total:s+g,base:baseRate,discAmt,discPct:parseFloat(it.discount)||0};
  }
  const ub=it.useBody!==false,ubat=it.useBat!==false,up=it.usePanel!==false,upo=it.usePole===true,ups=it.usePS===true,ufb=it.useFoundBolt===true,uld=it.useLadder===true,upt=it.usePainting===true;
  const base=(ub?getRate("bodies",it.bodyId)*(it.bodyQty||1):0)+(ubat?getRate("batteries",it.batId)*(it.batQty||1):0)+(up?getRate("panels",it.panelId)*(it.panelQty||1):0)+(upo?getRate("poles",it.poleId):0)+(ups?getRate("structures",it.psId):0)+(ufb?getRate("misc",it.foundBoltId)*(it.foundBoltQty||1):0)+(uld?getRate("misc",it.ladderId):0)+(upt?getRate("misc",it.paintingId):0);
  const m=(it.margin!=null?it.margin:gMargin)/100;
  const warr=isSolar(it.type)?((it.warranty===2?1.1:it.warranty===3?1.21:1)):1;
  const unit=Math.round(base*(1+m)*warr);
  const sub=unit*qty;const gst=sub*(it.gstPct||0)/100;
  return{unit,qty,sub,gst,trans:0,total:sub+gst,base};
}
const getTotals=()=>{
  const base=items.reduce((a,it)=>{const c=calcItem(it);a.sub+=c.sub;a.gst+=c.gst;a.grand+=c.total;return a;},{sub:0,gst:0,grand:0});
  const tAmt=parseFloat(quoteTransport.amount)||0;
  const tGst=tAmt*(parseFloat(quoteTransport.gstPct)||0)/100;
  const trans=tAmt+tGst;
  return{sub:base.sub,gst:base.gst,trans,transAmt:tAmt,transGst:tGst,grand:base.grand+trans};
};

function updField(id,field,val){
  const it=items.find(x=>x.id===id);if(!it)return;
  it[field]=val;
  if(field==="wattage"||field==="dimming"){const rec=getAutoRec(Number(field==="wattage"?val:it.wattage),field==="dimming"?val:it.dimming);it.batId=rec.bat;it.panelId=rec.panel;}
  if(field==="type"){
    if(!isSolar(val)){it.dimming="2stage";it.warranty=1;}
    if(val==="POLE"){it.useBody=false;it.useBat=false;it.usePanel=false;it.usePole=true;it.usePS=false;it.gstPct=18;}
    else if(val==="SSL"||val==="SHM"){it.useBody=true;it.useBat=true;it.usePanel=true;it.gstPct=5;}
    else if(val==="LED"){it.useBody=true;it.useBat=false;it.usePanel=false;it.usePole=false;it.gstPct=18;}
  }
  if(field==="catalogId"){
    const cp=catalog.find(x=>x.id===val);
    if(cp){it.customName=cp.name;it.customDesc=cp.desc;if(!it.customRate||it.customRate==0){it.customRate=cp.rate;it.originalRate=cp.rate;}}
  }
  if(field==="priceMasterId"){
    if(!val){it.priceMasterCat="";it.customName="";it.customDesc="";it.customRate="";it.originalRate=0;return;}
    // Search all price categories
    let found=null,foundCat="";
    for(const cat of Object.keys(prices)){
      const item=(prices[cat]||[]).find(x=>x.id===val);
      if(item){found=item;foundCat=cat;break;}
    }
    if(found){
      it.priceMasterCat=foundCat;
      it.customName=found.label;
      const desc=found.desc||(SPECS[foundCat]?.[found.id])||"";
      it.customDesc=desc;
      it.customRate=found.rate||0;
      it.originalRate=found.rate||0;
      it.discount=0;
    }
  }
  renderItems();
}
function toggleComp(id,field){
  const it=items.find(x=>x.id===id);if(!it)return;
  const defOff=field==="usePole"||field==="usePS";
  if(it[field]===undefined)it[field]=defOff;
  it[field]=!it[field];
  renderItems();
}

// Returns flat array of all products for search
function getPriceMasterAll(){
  const all=[];
  Object.entries(prices).forEach(([cat,items])=>{
    if(!items||!items.length)return;
    const catLabel=(CAT_ICO[cat]||"")+" "+(CAT_LBL[cat]||cat);
    items.forEach(it=>all.push({id:it.id,name:it.label,cat,catLabel,source:"prices"}));
  });
  catalog.forEach(cp=>all.push({id:cp.id,name:cp.name,cat:"catalog",catLabel:"⚙️ Custom Catalog",source:"catalog"}));
  return all;
}

function filterPriceMaster(query){
  const all=getPriceMasterAll();
  if(!query.trim())return all;
  const q=query.toLowerCase();
  return all.filter(x=>x.name.toLowerCase().includes(q)||x.catLabel.toLowerCase().includes(q));
}

function renderPMDropdown(itemId,query,selectedId){
  const results=filterPriceMaster(query);
  const dd=document.getElementById("pmDrop_"+itemId);
  if(!dd)return;
  if(!results.length){dd.innerHTML=`<div class="pm-no-result">No products found for "<b>${query}</b>"</div>`;return;}
  // Group by category
  const groups={};
  results.forEach(r=>{if(!groups[r.catLabel])groups[r.catLabel]=[];groups[r.catLabel].push(r);});
  dd.innerHTML=Object.entries(groups).map(([grp,items])=>
    `<div class="pm-cat-header">${grp}</div>`+
    items.map(r=>`<div class="pm-option${r.id===selectedId?" active":""}" onclick="selectPMItem('${itemId}','${r.id}')">
      <div class="pm-option-name">${r.name}</div>
    </div>`).join("")
  ).join("");
}

function selectPMItem(itemId,prodId){
  // Update the search input to show selected name
  const all=getPriceMasterAll();
  const prod=all.find(x=>x.id===prodId);
  const inp=document.getElementById("pmSearch_"+itemId);
  if(inp&&prod)inp.value=prod.name;
  hidePMDrop(itemId);
  updField(itemId,"priceMasterId",prodId);
}

function showPMDrop(itemId){
  const dd=document.getElementById("pmDrop_"+itemId);
  if(dd)dd.style.display="";
}
function hidePMDrop(itemId){
  const dd=document.getElementById("pmDrop_"+itemId);
  if(dd)dd.style.display="none";
}
function onPMSearchInput(itemId,query){
  showPMDrop(itemId);
  const it=items.find(x=>x.id===itemId);
  renderPMDropdown(itemId,query,it?it.priceMasterId||it.catalogId:"");
}
function clearPMSearch(itemId){
  const inp=document.getElementById("pmSearch_"+itemId);
  if(inp)inp.value="";
  const it=items.find(x=>x.id===itemId);
  if(it){it.priceMasterId="";it.priceMasterCat="";it.catalogId="";}
  const dd=document.getElementById("pmDrop_"+itemId);
  if(dd){renderPMDropdown(itemId,"","");dd.style.display="";}
}

// Close dropdown when clicking outside
document.addEventListener("click",function(e){
  document.querySelectorAll("[id^='pmDrop_']").forEach(dd=>{
    const itemId=dd.id.replace("pmDrop_","");
    const wrap=document.getElementById("pmWrap_"+itemId);
    if(wrap&&!wrap.contains(e.target))dd.style.display="none";

});

function syncDiscount(itemId,val){
  const it=items.find(x=>x.id===itemId);if(!it)return;
  it.discount=parseFloat(val)||0;
  const slider=document.getElementById("dslider_"+itemId);
  const numEl=document.getElementById("dnum_"+itemId);
  if(slider)slider.value=it.discount;
  if(numEl)numEl.value=it.discount;
  const calc=calcItem(it);
  const afterEl=document.getElementById("dafter_"+itemId);
  const totalEl=document.getElementById("dtotal_"+itemId);
  const discAmtEl=document.getElementById("ddiscamt_"+itemId);
  if(afterEl)afterEl.textContent=inr(calc.unit);
  if(totalEl)totalEl.textContent=inr(calc.total);
  if(discAmtEl)discAmtEl.textContent="-"+inr(calc.discAmt);
  updateTotals();
}

function mkSel(cat,sel,isAdmin){return(prices[cat]||[]).map(x=>`<option value="${x.id}"${x.id===sel?" selected":""}>${x.label}${isAdmin&&x.rate?" — "+inr(x.rate):""}</option>`).join("");}

function updateTotals(){
  const t=getTotals();
  const s=document.getElementById("tSub"),g=document.getElementById("tGst"),gr=document.getElementById("tGrand"),w=document.getElementById("tWords");
  if(s)s.textContent=inr(t.sub);if(g)g.textContent=inr(t.gst);if(gr)gr.textContent=inr(t.grand);if(w)w.textContent=amtWords(t.grand);
  const tr=document.getElementById("tTransRow");
  if(tr){if(t.trans>0){tr.style.display="";const tt=document.getElementById("tTrans");if(tt)tt.textContent=inr(t.trans);}else tr.style.display="none";}
  // transport preview box
  const tp=document.getElementById("transPreview");
  if(tp){
    if(t.transAmt>0){
      tp.style.display="";
      tp.innerHTML=`🚚 Transport: ${inr(t.transAmt)} + GST (${quoteTransport.gstPct}%): ${inr(t.transGst)} = <b>${inr(t.trans)}</b>`;
    } else {tp.style.display="none";}
  }
}

// ═══ AUTO DESCRIPTION ═══
function buildAutoDesc(it){
  if(it.custom){const d=it.customDesc||it.customName||(it.customName?it.customName:"Custom Item");return d;}
  const parts=[];
  const type=it.type==="SSL"?"Solar Street Light":it.type==="SHM"?"Solar High Mast":it.type==="LED"?"LED Street Light":"Pole Only";
  parts.push(type);
  if(it.type!=="POLE")parts.push(`${it.wattage}W`);
  if(it.useBody!==false){const b=(prices.bodies||[]).find(x=>x.id===it.bodyId);if(b)parts.push(`${b.label}${(it.bodyQty||1)>1?' × '+(it.bodyQty||1):''}`)}
  if(it.useBat!==false){const b=(prices.batteries||[]).find(x=>x.id===it.batId);if(b)parts.push(`${b.label} × ${it.batQty||1}`);}
  if(it.usePanel!==false){const p=(prices.panels||[]).find(x=>x.id===it.panelId);if(p)parts.push(`${p.label} × ${it.panelQty||1}`);}
  if(it.usePole===true){const p=(prices.poles||[]).find(x=>x.id===it.poleId);if(p&&it.poleId!=="NONE")parts.push(p.label);}
  if(it.usePS===true){const p=(prices.structures||[]).find(x=>x.id===it.psId);if(p&&it.psId!=="PS_NONE")parts.push(p.label);}
  if(it.useFoundBolt===true){const f=(prices.misc||[]).find(x=>x.id===it.foundBoltId);if(f)parts.push(f.label);}
  if(it.useLadder===true){const l=(prices.misc||[]).find(x=>x.id===it.ladderId);if(l)parts.push(l.label);}
  if(it.usePainting===true){const p=(prices.misc||[]).find(x=>x.id===it.paintingId);if(p)parts.push(p.label);}
  if(isSolar(it.type)){const dm={"4stage":"4 Stage","3stage":"3 Stage","2stage":"2 Stage","constant":"Constant (Dusk-Dawn)"};parts.push(dm[it.dimming]||it.dimming);parts.push(`Warranty: ${it.warranty} Year`);}
  return parts.join(" / ");
}

function doAddP(ct){

function showConfirm(title,msg,onYes){

  if(!ov){
    ov=document.createElement("div");ov.id="confirmModal";ov.className="modal-overlay";

      <div class="modal-title" id="cmTitle"></div>

        <button class="modal-cancel" onclick="hideConfirm()">✕ Cancel</button>
        <button class="modal-confirm" id="cmYes">🗑 Yes, Delete</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
  }
  document.getElementById("cmTitle").textContent=title;
  document.getElementById("cmMsg").textContent=msg;
  document.getElementById("cmYes").onclick=()=>{hideConfirm();onYes();};
  ov.style.display="flex";
}

function startPE(id,ct){
  document.getElementById("pview_"+id).style.display="none";
  document.getElementById("pedit_"+id).style.display="";
  // pre-fill description from SPECS if empty
  const descEl=document.getElementById("ed_"+id);
  if(descEl&&!descEl.value.trim()){const sp=SPECS[ct]?.[id];if(sp)descEl.value=sp;}
}
function cancelPE(id){
  document.getElementById("pview_"+id).style.display="";
  document.getElementById("pedit_"+id).style.display="none";
}
function savePE(ct,id){
  const nl=document.getElementById("el_"+id)?.value.trim();
  const nr=parseFloat(document.getElementById("ev_"+id)?.value)||0;
  const nd=document.getElementById("ed_"+id)?.value.trim()||"";
  const nw=document.getElementById("ew_"+id);
  const it=prices[ct].find(x=>x.id===id);
  if(!it||!nl){alert("Product name cannot be empty!");return;}
  it.label=nl;it.rate=nr;it.desc=nd;
  if(nw)it.maxW=parseInt(nw.value)||undefined;
  // Also update SPECS cache so spec box shows new description
  if(!SPECS[ct])SPECS[ct]={};
  SPECS[ct][id]=nd;
  savePrices();
  cancelPE(id);
  renderPList();
  showMsg("pMsg","✅ Product updated!","msg-ok");
}

function doAddCategory(){
  const label=document.getElementById("newCatLabel")?.value.trim();
  let key=document.getElementById("newCatKey")?.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
  const icon=document.getElementById("newCatIcon")?.value||"📦";
  const color=document.getElementById("newCatColor")?.value||"#374151";
  if(!label){showMsg("newCatMsg","❌ Category name is required!","msg-err");return;}
  if(!key)key=label.toLowerCase().replace(/[^a-z0-9]/g,"_").slice(0,20);
  if(CAT_LBL[key]){showMsg("newCatMsg","❌ Category key already exists! Try a different name.","msg-err");return;}
  // Add to runtime metadata
  CAT_CLR[key]=color;CAT_ICO[key]=icon;CAT_LBL[key]=label;

  // Save user categories to localStorage
  const uc=JSON.parse(localStorage.getItem("ex_user_cats")||"[]");

  savePrices();

function selectExportCode(){
  var el=document.getElementById("exportCodeBox");
  if(!el)return;
  if(window.getSelection){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
}

function copyExportCode(){
  var el=document.getElementById("exportCodeBox");
  if(!el)return;
  var text=el.textContent||el.innerText;
  var msg=document.getElementById("copyCodeMsg");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      if(msg){msg.textContent="✅ Copied! Now paste it in WhatsApp.";setTimeout(function(){if(msg)msg.textContent="";},3000);}
    }).catch(function(){fallbackCopy(text,msg);});
  }else{fallbackCopy(text,msg);}
}

function fallbackCopy(text,msg){
  var ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");if(msg){msg.textContent="✅ Copied!";setTimeout(function(){if(msg)msg.textContent="";},3000);}}
  catch(e){if(msg)msg.textContent="❌ Copy failed — tap the code box and copy manually";}
  document.body.removeChild(ta);
}

function shareCodeWA(){
  var code=window._exportCode||"";
  if(!code){showMsg("exportMsg","❌ Please tap Export first","msg-err");return;}
  var nl="\n";
  var msg="*ENTRIX App Price Update*"+nl+nl
    +"Admin has updated the product prices."+nl+nl
    +"To import: Open app > Settings > Import Price Code > Paste code > Tap Import"+nl+nl
    +"*PRICE CODE:*"+nl+code+nl+nl
    +"_ENTRIX INNOVATION_";
  window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}

function importPriceCode(){
  var ta=document.getElementById("importCodeTA");
  if(!ta||!ta.value.trim()){showMsg("importMsg","❌ Please paste the price code first","msg-err");return;}
  try{
    var decoded=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));
    if(decoded.p)prices=decoded.p;
    if(decoded.c)catalog=decoded.c;
    if(decoded.u)localStorage.setItem("ex_user_cats",JSON.stringify(decoded.u));
    if(decoded.pin)adminPin=decoded.pin;
    if(decoded.m!=null)gMargin=decoded.m;
    localStorage.setItem("ex_p",JSON.stringify(prices));
    localStorage.setItem("ex_c",JSON.stringify(catalog));
    localStorage.setItem("ex_pin",adminPin);
    localStorage.setItem("ex_m",String(gMargin));
    ta.value="";
    showMsg("importMsg","✅ Prices imported successfully! All products updated.","msg-ok");
    // Reload user cats
    var uc=JSON.parse(localStorage.getItem("ex_user_cats")||"[]");
    uc.forEach(function(c){CAT_CLR[c.key]=c.color;CAT_ICO[c.key]=c.icon;CAT_LBL[c.key]=c.label;if(!prices[c.key])prices[c.key]=[];});
  }catch(e){
    showMsg("importMsg","❌ Invalid code. Ask admin to resend the price code.","msg-err");
  }
}

async function shareWA(){
  const t=getTotals();
  const qno=V("quoteNo")||"ENTRIX-Quote";

  // Build WhatsApp text message
  const lines=[
    `*${V("docType").toUpperCase()} — ENTRIX INNOVATION*`,
    `📋 ${V("quoteNo")} | Date: ${dateStr(V("quoteDate"))}`,
    `👤 To: ${V("cName")||"Client"}${V("cCity")?", "+V("cCity"):""}`,
    ``,`*ITEMS:*`,
    ...items.map((it,i)=>{const c=calcItem(it);const nm=it.custom?(it.customName||"Custom Item"):`${it.wattage?it.wattage+"W ":""}${it.type}`;return`${i+1}. ${nm} × ${c.qty} — *${inr(c.total)}* (GST ${it.gstPct||0}%)`;}),
    ``,`*Grand Total: ${inr(t.grand)}*`,`_(${amtWords(t.grand)})_`,
    ``,`📄 PDF quotation attached below`,`📞 ${CO.email}`,`🌐 ${CO.web}`
  ];
  const waText=lines.join("\n");

  // Check if html2canvas and jsPDF loaded
  if(typeof html2canvas==="undefined"||typeof window.jspdf==="undefined"){
    // Fallback: just open WhatsApp with text
    window.open("https://wa.me/?text="+encodeURIComponent(waText),"_blank");
    showMsg("quoteMsg","✅ Opening WhatsApp (PDF library not loaded)","msg-ok");
    return;
  }

  try{
    showWAOverlay("📄 Generating PDF…","Rendering quotation…",10);

    // Render preview first
    renderPreview();
    await new Promise(r=>setTimeout(r,400));

    const docEl=document.getElementById("quote-doc");
    if(!docEl){hideWAOverlay();showMsg("quoteMsg","❌ Preview not found — open Preview tab first","msg-err");return;}

    showWAOverlay("📄 Generating PDF…","Capturing quotation layout…",30);

    // Capture with html2canvas
    const canvas=await html2canvas(docEl,{
      scale:2,useCORS:true,allowTaint:true,
      backgroundColor:"#ffffff",
      logging:false,
      windowWidth:900
    });

    showWAOverlay("📄 Generating PDF…","Building PDF file…",60);

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const imgW=210;
    const imgH=(canvas.height*imgW)/canvas.width;
    const pageH=297;

    if(imgH<=pageH){
      pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,imgW,imgH);
    } else {
      // Multi-page
      let yOffset=0;
      while(yOffset<imgH){
        const srcY=(yOffset/imgH)*canvas.height;
        const srcH=Math.min((pageH/imgH)*canvas.height,canvas.height-srcY);
        const pageCanvas=document.createElement("canvas");
        pageCanvas.width=canvas.width;
        pageCanvas.height=srcH;
        pageCanvas.getContext("2d").drawImage(canvas,0,srcY,canvas.width,srcH,0,0,canvas.width,srcH);
        if(yOffset>0)pdf.addPage();
        const sliceH=Math.min(pageH,imgH-yOffset);
        pdf.addImage(pageCanvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,imgW,sliceH);
        yOffset+=pageH;
      }
    }

    const pdfBlob=pdf.output("blob");
    const fileName=(qno.split("/").join("-"))+"_ENTRIX.pdf";
    const pdfFile=new File([pdfBlob],fileName,{type:"application/pdf"});

    showWAOverlay("📱 Opening WhatsApp…","Sharing PDF…",85);
    await new Promise(r=>setTimeout(r,300));

    // Try Web Share API (works on Android Chrome & iOS Safari)
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[pdfFile]})){
      await navigator.share({
        title:`Quotation ${qno} — ENTRIX INNOVATION`,
        text:waText,
        files:[pdfFile]
      });
      hideWAOverlay();
      showMsg("quoteMsg","✅ PDF shared via WhatsApp!","msg-ok");
    } else {
      // Fallback: download PDF + open WhatsApp text
      hideWAOverlay();
      showWAOverlay("📥 Downloading PDF…","PDF saved to your device\nNow opening WhatsApp — attach the PDF manually",90);
      const url=URL.createObjectURL(pdfBlob);
      const a=document.createElement("a");a.href=url;a.download=fileName;a.click();
      URL.revokeObjectURL(url);
      await new Promise(r=>setTimeout(r,1200));
      hideWAOverlay();
      window.open("https://wa.me/?text="+encodeURIComponent(waText),"_blank");
      showMsg("quoteMsg","✅ PDF downloaded + WhatsApp opened — attach the PDF!","msg-ok");
    }
  }catch(err){
    hideWAOverlay();
    if(err.name==="AbortError"){showMsg("quoteMsg","ℹ️ Share cancelled","msg-info");return;}
    console.error("WA share error:",err);
    // Final fallback
    window.open("https://wa.me/?text="+encodeURIComponent(waText),"_blank");
    showMsg("quoteMsg","✅ WhatsApp opened (text only)","msg-ok");
  }
}

// ═══ VERSION & CACHE CHECK ═══
const APP_VERSION = "v2.0525.1754";

function checkVersion(){
  const stored = localStorage.getItem("ex_app_version");
  if(stored && stored !== APP_VERSION){
    // New version detected — show update bar
    const bar = document.createElement("div");
    bar.className = "update-notice";
    bar.id = "updateBar";
    bar.innerHTML = `⚡ New version loaded (v2.0525.1754). Old version was ${stored}. &nbsp;<button onclick="hardRefresh()">🔄 Reload Now</button><button onclick="dismissUpdate()" style="background:rgba(0,0,0,.2);color:#fff;margin-left:6px">✕</button>`;
    document.body.appendChild(bar);
  }
  localStorage.setItem("ex_app_version", APP_VERSION);
}

function hardRefresh(){
  // Clear all caches and reload
  if('caches' in window){
    caches.keys().then(names => names.forEach(n => caches.delete(n)));
  }
  // Force reload bypassing cache
  window.location.reload(true);
}

function dismissUpdate(){
  const bar = document.getElementById("updateBar");
  if(bar) bar.remove();
}

// Force browser to always read fresh file (no cache)
(function(){
  const html = document.querySelector("html");
  if(html) html.setAttribute("data-version", APP_VERSION);
})();
